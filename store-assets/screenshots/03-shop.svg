<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="DejaVu Sans">
  <rect width="1080" height="1920" fill="#3FA483"/>
  <text x="64" y="150" font-size="62" font-weight="bold" fill="#ffffff">Копи монеты —</text>
  <text x="64" y="226" font-size="62" font-weight="bold" fill="#ffffff">меняй на награды</text>
  <text x="64" y="300" font-size="36" fill="#D7F0E6">Каждая награда согласована с родителем</text>

  <!-- phone -->
  <rect x="150" y="372" width="780" height="1452" rx="78" fill="#1B2238"/>
  <rect x="172" y="394" width="736" height="1408" rx="58" fill="#ECEEF6"/>
  <rect x="470" y="412" width="140" height="14" rx="7" fill="#1B2238"/>

  <!-- balance header -->
  <rect x="172" y="440" width="736" height="150" fill="#ffffff"/>
  <text x="208" y="500" font-size="30" fill="#8A90A2">Магазин наград</text>
  <circle cx="226" cy="548" r="22" fill="#E7A92B"/>
  <text x="226" y="557" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>
  <text x="262" y="560" font-size="46" font-weight="bold" fill="#1B2238">240 PIP</text>

  <!-- reward card 1 -->
  <rect x="208" y="624" width="320" height="330" rx="26" fill="#ffffff" stroke="#E3E6EF" stroke-width="2"/>
  <rect x="232" y="652" width="272" height="150" rx="20" fill="#FDEFEA"/>
  <text x="368" y="752" font-size="80" text-anchor="middle" fill="#EE6C4D">▶</text>
  <text x="236" y="848" font-size="32" font-weight="bold" fill="#1B2238">Час игр</text>
  <text x="236" y="888" font-size="26" font-weight="bold" fill="#9A6A12">50 PIP</text>
  <rect x="236" y="906" width="264" height="64" rx="20" fill="#EE6C4D"/>
  <text x="368" y="948" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Купить</text>

  <!-- reward card 2 -->
  <rect x="552" y="624" width="320" height="330" rx="26" fill="#ffffff" stroke="#E3E6EF" stroke-width="2"/>
  <rect x="576" y="652" width="272" height="150" rx="20" fill="#E9F4EF"/>
  <text x="712" y="752" font-size="80" text-anchor="middle" fill="#3FA483">♥</text>
  <text x="580" y="848" font-size="32" font-weight="bold" fill="#1B2238">Пицца</text>
  <text x="580" y="888" font-size="26" font-weight="bold" fill="#9A6A12">150 PIP</text>
  <rect x="580" y="906" width="264" height="64" rx="20" fill="#EE6C4D"/>
  <text x="712" y="948" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Купить</text>

  <!-- reward card 3 -->
  <rect x="208" y="978" width="320" height="330" rx="26" fill="#ffffff" stroke="#E3E6EF" stroke-width="2"/>
  <rect x="232" y="1006" width="272" height="150" rx="20" fill="#EEEAFB"/>
  <text x="368" y="1106" font-size="80" text-anchor="middle" fill="#7A6FE0">★</text>
  <text x="236" y="1202" font-size="32" font-weight="bold" fill="#1B2238">Поход в кино</text>
  <text x="236" y="1242" font-size="26" font-weight="bold" fill="#9A6A12">200 PIP</text>
  <rect x="236" y="1260" width="264" height="64" rx="20" fill="#EE6C4D"/>
  <text x="368" y="1302" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Купить</text>

  <!-- reward card 4 (goal) -->
  <rect x="552" y="978" width="320" height="330" rx="26" fill="#FFFBF0" stroke="#F2C14E" stroke-width="3"/>
  <rect x="576" y="1006" width="272" height="150" rx="20" fill="#FDF1D6"/>
  <text x="712" y="1106" font-size="80" text-anchor="middle" fill="#E7A92B">◆</text>
  <text x="580" y="1202" font-size="32" font-weight="bold" fill="#1B2238">Новая игра</text>
  <text x="580" y="1242" font-size="26" font-weight="bold" fill="#9A6A12">380 PIP</text>
  <rect x="580" y="1262" width="264" height="14" rx="7" fill="#EFE6CC"/>
  <rect x="580" y="1262" width="167" height="14" rx="7" fill="#E7A92B"/>
  <text x="580" y="1306" font-size="24" fill="#9A6A12">цель · ещё 140</text>

  <!-- hint -->
  <rect x="208" y="1336" width="664" height="92" rx="22" fill="#E9F4EF"/>
  <text x="540" y="1392" font-size="28" fill="#2F7A63" text-anchor="middle">Накопил на цель — родитель выдаёт награду</text>

  <!-- bottom tab bar -->
  <rect x="172" y="1700" width="736" height="102" fill="#ffffff"/>
  <text x="320" y="1762" font-size="26" fill="#9AA0B0" text-anchor="middle">Задания</text>
  <text x="540" y="1762" font-size="26" font-weight="bold" fill="#EE6C4D" text-anchor="middle">Магазин</text>
  <text x="760" y="1762" font-size="26" fill="#9AA0B0" text-anchor="middle">Награды</text>

  <text x="540" y="1900" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">pipup.ru</text>
</svg>
