<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="DejaVu Sans">
  <rect width="1080" height="1920" fill="#1B2238"/>
  <text x="64" y="150" font-size="62" font-weight="bold" fill="#ffffff">Родитель всё видит</text>
  <text x="64" y="226" font-size="62" font-weight="bold" fill="#ffffff">и подтверждает</text>
  <text x="64" y="300" font-size="36" fill="#AEB6CC">Прогресс детей, баланс и заявки на проверку</text>

  <!-- phone -->
  <rect x="150" y="372" width="780" height="1452" rx="78" fill="#000000"/>
  <rect x="172" y="394" width="736" height="1408" rx="58" fill="#ECEEF6"/>
  <rect x="470" y="412" width="140" height="14" rx="7" fill="#000000"/>

  <!-- top bar -->
  <rect x="172" y="440" width="736" height="92" fill="#ffffff"/>
  <text x="208" y="500" font-size="44" font-weight="bold" fill="#1B2238">pip</text>
  <text x="800" y="495" font-size="28" fill="#5F6680" text-anchor="end">Анна</text>
  <circle cx="850" cy="486" r="24" fill="#EE6C4D"/>
  <text x="850" y="496" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">А</text>

  <!-- section header -->
  <text x="216" y="610" font-size="34" font-weight="bold" fill="#1B2238"><tspan fill="#EE6C4D">⚡ 2</tspan> на проверку</text>
  <rect x="744" y="578" width="128" height="48" rx="24" fill="#FDE9E2"/>
  <text x="808" y="610" font-size="26" font-weight="bold" fill="#C2451F" text-anchor="middle">+ Ребёнок</text>

  <!-- child card 1 (expanded) -->
  <rect x="208" y="648" width="664" height="540" rx="28" fill="#ffffff" stroke="#E3E6EF" stroke-width="2"/>
  <circle cx="272" cy="716" r="40" fill="#EE6C4D"/>
  <text x="272" y="730" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">М</text>
  <text x="332" y="704" font-size="36" font-weight="bold" fill="#1B2238">Миша</text>
  <text x="332" y="744" font-size="26" fill="#8A90A2">9 лет</text>
  <rect x="676" y="686" width="170" height="60" rx="30" fill="#FDF1D6"/>
  <text x="761" y="724" font-size="30" font-weight="bold" fill="#9A6A12" text-anchor="middle">240 PIP</text>

  <line x1="240" y1="780" x2="840" y2="780" stroke="#EEF0F6" stroke-width="2"/>

  <text x="240" y="838" font-size="26" font-weight="bold" fill="#5F6680">НА ПРОВЕРКУ</text>

  <!-- approval 1 -->
  <rect x="240" y="864" width="600" height="120" rx="20" fill="#FFFBF0" stroke="#F2C14E" stroke-width="2"/>
  <rect x="262" y="894" width="60" height="60" rx="16" fill="#FDEFEA"/>
  <text x="292" y="936" font-size="30" text-anchor="middle" fill="#EE6C4D">✦</text>
  <text x="342" y="912" font-size="30" font-weight="bold" fill="#1B2238">Помыть посуду</text>
  <text x="342" y="950" font-size="24" fill="#9A6A12">30 PIP · с фото</text>
  <circle cx="726" cy="924" r="32" fill="#5BA890"/>
  <path d="M712 924 l10 10 l18 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="924" r="32" fill="#F4E4E1"/>
  <path d="M788 912 l24 24 M812 912 l-24 24" stroke="#C2451F" stroke-width="6" stroke-linecap="round"/>

  <!-- approval 2 -->
  <rect x="240" y="1000" width="600" height="120" rx="20" fill="#FFFBF0" stroke="#F2C14E" stroke-width="2"/>
  <rect x="262" y="1030" width="60" height="60" rx="16" fill="#E9F4EF"/>
  <text x="292" y="1072" font-size="30" text-anchor="middle" fill="#5BA890">✎</text>
  <text x="342" y="1048" font-size="30" font-weight="bold" fill="#1B2238">Сделать уроки</text>
  <text x="342" y="1086" font-size="24" fill="#9A6A12">25 PIP</text>
  <circle cx="726" cy="1060" r="32" fill="#5BA890"/>
  <path d="M712 1060 l10 10 l18 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="1060" r="32" fill="#F4E4E1"/>
  <path d="M788 1048 l24 24 M812 1048 l-24 24" stroke="#C2451F" stroke-width="6" stroke-linecap="round"/>

  <!-- child card 2 (collapsed) -->
  <rect x="208" y="1212" width="664" height="120" rx="28" fill="#ffffff" stroke="#E3E6EF" stroke-width="2"/>
  <circle cx="272" cy="1272" r="40" fill="#5BA890"/>
  <text x="272" y="1286" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Л</text>
  <text x="332" y="1262" font-size="36" font-weight="bold" fill="#1B2238">Лиза</text>
  <text x="332" y="1302" font-size="26" fill="#8A90A2">все задания на сегодня сделаны</text>
  <rect x="676" y="1242" width="170" height="60" rx="30" fill="#FDF1D6"/>
  <text x="761" y="1280" font-size="30" font-weight="bold" fill="#9A6A12" text-anchor="middle">120 PIP</text>

  <!-- bottom tab bar -->
  <rect x="172" y="1700" width="736" height="102" fill="#ffffff"/>
  <text x="320" y="1762" font-size="26" font-weight="bold" fill="#EE6C4D" text-anchor="middle">Дети</text>
  <text x="540" y="1762" font-size="26" fill="#9AA0B0" text-anchor="middle">Задания</text>
  <text x="760" y="1762" font-size="26" fill="#9AA0B0" text-anchor="middle">Награды</text>

  <text x="540" y="1900" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.85">pipup.ru</text>
</svg>
